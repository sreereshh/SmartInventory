          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        phone:
          type: string
          pattern: ^[0-9+\-\s()]{7,20}$
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        order_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - order_count
      - phone
    CustomerRequest:
      type: object
      properties:
        name:

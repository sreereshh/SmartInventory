{% extends "base.html" %}
{% block title %}Delete {{ object_label }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card border-danger">
      <div class="card-body p-4 text-center">
        <div class="stat-icon icon-red mx-auto mb-3" style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;"><i class="bi bi-trash3"></i></div>
        <h2 class="h4">Delete this {{ object_label }}?</h2>
        <p class="mb-1 fw-semibold">{{ object_name }}</p>
        {% if warning %}<p class="text-muted small">{{ warning }}</p>{% endif %}
        <p class="text-danger small">This action cannot be undone.</p>
        <form method="post" class="d-flex justify-content-center gap-2 mt-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash3 me-1"></i>Yes, delete</button>
          <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
